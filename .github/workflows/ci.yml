name: CI

on:
    pull_request:
    push:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Check formatting
              run: make fmt-check

            - name: Tidy modules
              run: make tidy

            - name: Verify tidy did not change dependencies
              run: git diff --exit-code -- go.mod go.sum

            - name: Run tests
              run: make test

            - name: Run vet
              run: make vet

            - name: Build application
              run: make build

            - name: Clean build artifacts
              if: always()
              run: make clean
